# Render blueprint — https://render.com/docs/blueprint-spec
#
# One web service serves everything: the generated pages out of dist/, plus the
# two things that cannot be a static file — the event submission queue and the
# style tokens.
#
# This needs a PAID instance type, because a persistent disk requires one.
# Without a disk, SQLite would be wiped on every deploy and every submission
# would be lost. Render shows the cost before the service is created; confirm
# it there.
#
# If you would rather stay on the free static tier, the previous setup is one
# commit back in git history: `runtime: static` with `staticPublishPath: ./dist`
# and no disk. That serves the public pages perfectly but has nowhere to put a
# submission.

services:
  - type: web
    name: earlymusicsa
    runtime: node
    plan: starter          # smallest paid tier; required for a disk
    region: oregon

    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true       # every push to main redeploys
    pullRequestPreviewsEnabled: false

    # The database lives here so it survives deploys. Everything else in the
    # container is replaced on each one.
    disk:
      name: earlymusicsa-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # Generated once by Render and never shown in this file or in git.
      # Read it from the service's Environment tab when you need it.
      - key: ADMIN_TOKEN
        generateValue: true

      - key: DB_PATH
        value: /var/data/earlymusicsa.sqlite

      - key: NODE_VERSION
        value: "22"

# Note: no `headers:` block here. Render only supports that on static sites —
# a web service is expected to set its own. server.js does, including the
# long cache on /media/* and the security headers.
